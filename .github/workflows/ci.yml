name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: voxa
          POSTGRES_PASSWORD: voxa
          POSTGRES_DB: voxa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voxa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://voxa:voxa@localhost:5432/voxa
      # The graph and calendar tests never call the model; these just satisfy
      # settings validation at import time.
      AZURE_OPENAI_ENDPOINT: https://example.openai.azure.com
      AZURE_OPENAI_API_KEY: test
      AZURE_OPENAI_CHAT_DEPLOYMENT: gpt-4.1
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: text-embedding-3-small

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests alembic scripts
      - run: alembic upgrade head
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src scripts
      # Build with placeholder public config. No page is prerendered against a
      # real backend, so these only need to exist.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_...
          CLERK_SECRET_KEY: sk_test_...
